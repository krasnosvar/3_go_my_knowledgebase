[databases]
; Primary database (writes)
primary = host=db-primary port=5432 dbname=postgres

; Convenience alias for tools that expect the database to be named "postgres"
postgres = host=db-primary port=5432 dbname=postgres

; Default route: allow connecting to any database name through PgBouncer (goes to primary)
* = host=db-primary port=5432

; Replica database (reads)
replica = host=db-replica port=5432 dbname=postgres

[pgbouncer]
listen_port = 6432
listen_addr = *
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = admin
stats_users = admin
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 50
reserve_pool_size = 20
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
ignore_startup_parameters = extra_float_digits
