# Replica PostgreSQL config (practice stack)

listen_addresses = '*'
port = 5432

hot_standby = on
hot_standby_feedback = on

# Must be >= primary setting during recovery/standby
max_connections = 1000

# Important: pg_basebackup -R writes standby connection settings into:
# /var/lib/postgresql/data/postgresql.auto.conf
# If we override config_file, we must include that file explicitly.
include_if_exists = '/var/lib/postgresql/data/postgresql.auto.conf'

