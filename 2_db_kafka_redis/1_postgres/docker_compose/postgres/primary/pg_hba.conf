# TYPE  DATABASE        USER            ADDRESS                 METHOD
#
# Minimal auth rules for local practice:
# - local socket: trust (so `docker compose exec db-primary psql ...` works without password prompt)
# - host TCP: md5
# - replication: md5 (required for pg_basebackup/streaming replication)

local   all             all                                     trust

host    all             all             127.0.0.1/32            md5
host    all             all             0.0.0.0/0               md5

host    all             all             ::1/128                 md5
host    all             all             ::/0                    md5

host    replication     all             0.0.0.0/0               md5
host    replication     all             ::/0                    md5

