# Primary PostgreSQL config (practice stack)

listen_addresses = '*'
port = 5432

# Replication (streaming) settings
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10

# Keep passwords compatible with PgBouncer md5 userlist
password_encryption = md5

# Keep replica compatible during recovery (must be >= replica setting)
max_connections = 1000

